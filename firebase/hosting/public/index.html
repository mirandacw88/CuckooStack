<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuckoo Stack</title>
  <meta name="description" content="Stack eggs, smash walls, beat today's course. Free on iOS and Android.">
  <style>
    :root { --ink:#07060f; --neon:#29e7ff; --hot:#ff2bd6; --text:#eafaff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 30%, #1d0b36, var(--ink) 70%);
           color:var(--text); font:500 17px/1.5 system-ui, sans-serif; padding:24px 16px; text-align:center; }
    h1 { font:900 clamp(40px, 12vw, 72px)/0.95 system-ui, sans-serif; margin:0 0 12px; text-shadow:-3px 0 var(--hot), 3px 0 var(--neon); }
    p { opacity:.85; max-width:30ch; margin:0 auto 28px; }
    .stores { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .stores a { padding:14px 22px; border:2px solid var(--hot); border-radius:8px; color:var(--text); text-decoration:none; font-weight:700;
                letter-spacing:.12em; text-transform:uppercase; box-shadow:0 0 18px rgba(255,43,214,.35); }
  </style>
</head>
<body>
  <main>
    <h1>Cuckoo Stack</h1>
    <p>Stack eggs, smash walls and beat today's course. A new one drops at midnight.</p>
    <div class="stores">
      <!-- store URLs: replace with the listing links once the apps are live -->
      <a href="https://apps.apple.com/app/id0000000000">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.cuckoostack.aerospheregames">Google Play</a>
    </div>
  </main>
</body>
</html>
