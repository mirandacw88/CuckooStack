# Every push and pull request: build the desktop target and run all the unit tests (the same as the local
# pre-commit hook, .githooks/pre-commit). macOS, so the iOS video recorder's test (VideoToolbox) runs too.
# Shaders come precompiled (assets/shaders/generated) and Vulkan is loaded at runtime, so no Vulkan SDK is needed.
name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 120
